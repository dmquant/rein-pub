[package]
name = "rein"
description = "Rein — a financial research harness (CLI). Binary surface per design §9."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "rein"
path = "src/main.rs"

[dependencies]
rein-core = { path = "../rein-core" }
rein-runtime = { path = "../rein-runtime" }
rein-finance = { path = "../rein-finance" }
rein-propose = { path = "../rein-propose" }
clap = { version = "=4.4.18", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
thiserror = "1"
# TUI (M4): versions proven in the sibling-estate estate.
ratatui = "=0.26.3"
crossterm = "=0.27.0"

[dev-dependencies]
tempfile = "=3.10.1"
